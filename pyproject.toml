[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-pendant-prep"
version = "0.3.3"
description = "Cross-platform image preparation for layered FDM photo prints and pendants"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10.4,<13",
  "pillow-heif>=0.18,<2",
  "PySide6>=6.8,<6.13",
  "onnxruntime>=1.18,<2",
]

[project.scripts]
lumina-pendant-prep = "lumina_pendant_prep.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumina_pendant_prep = ["assets/*.png", "assets/*.ico"]

