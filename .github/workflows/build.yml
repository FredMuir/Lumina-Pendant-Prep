name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and packager
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - name: Run Windows-compatible test suite
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package desktop app
        run: >-
          pyinstaller --clean --noconfirm --windowed --onedir
          --name LuminaPendantPrep
          --collect-all PySide6
          --collect-all pillow_heif
          --collect-all cv2
          run_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/LuminaPendantPrep
          if-no-files-found: error
          retention-days: 14

